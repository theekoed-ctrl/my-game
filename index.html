<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catch The Stars ⭐⭐ (Dual Paddles)</title>
  <style>
    :root { --bg:#0b1020; --fg:#e6f0ff; --accent:#69f; --good:#42d77d; --bad:#ff6b6b; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: radial-gradient(1200px 600px at 70% -10%, #1e2a55 0%, var(--bg) 60%); color: var(--fg); font-family: system-ui, -apple-system, Segoe UI, Roboto, Emoji, Noto Color Emoji, Arial, sans-serif; }
    .wrap { min-height: 100%; display: grid; place-items: center; padding: 16px; }
    .card { width: min(900px, 96vw); background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); border-radius: 24px; padding: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.35); backdrop-filter: blur(6px); }
    header { display:flex; align-items:center; gap:12px; padding: 8px 12px 12px; flex-wrap: wrap; }
    header h1 { font-size: clamp(20px, 4vw, 28px); margin:0; letter-spacing:.5px; }
    header .pill { margin-left:auto; font-weight:700; padding:6px 10px; border-radius:999px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); }
    canvas { width: 100%; height: auto; border-radius: 16px; background: #060913; display:block; border:1px solid rgba(255,255,255,.15); }
    .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    .btn { user-select:none; -webkit-user-select:none; cursor:pointer; font-weight:700; padding:10px 14px; border-radius:12px; border:1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.08); color:var(--fg); box-shadow: 0 6px 20px rgba(0,0,0,.25); transition: transform .05s ease; }
    .btn:active { transform: translateY(1px) scale(.98); }
    .hint { opacity:.9; font-size: 14px; }
    .controls { display:grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap:10px; margin-top:10px; }
    .dpad .btn { padding: 14px 0; text-align:center; }
    @media (pointer: coarse) { .mobile-only { display:grid; } }
    @media (pointer: fine) { .mobile-only { display:none; } }
    .label { font-size:12px; opacity:.8; text-align:center; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <header>
        <h1>Catch The Stars ⭐⭐ — dual paddles</h1>
        <div class="pill hint">Left Paddle: A/D • Right Paddle: ◀︎ ▶︎ • One star at a time (random side)</div>
      </header>

      <canvas id="game" width="900" height="520" aria-label="Catch the Stars game area"></canvas>

      <div class="row" style="justify-content:space-between; margin-top:10px;">
        <div class="row" style="gap:8px;">
          <button class="btn" id="restart">Restart</button>
          <button class="btn" id="slower">– Speed</button>
          <button class="btn" id="faster">+ Speed</button>
        </div>
        <div class="hint">Left paddle uses <b>A/D</b> • Right paddle uses <b>Arrow Keys</b>. On phones, use the pads below.</div>
      </div>

      <!-- Mobile on-screen controls: two pads -->
      <div class="mobile-only" style="grid-template-columns: 1fr 1fr; gap:14px; margin-top:12px;">
        <div class="dpad controls">
          <div class="label">Left Paddle (A/D)</div>
          <div></div>
          <button class="btn" id="left1">◀︎</button>
          <div></div>
          <div></div>
          <button class="btn" id="right1">▶︎</button>
          <div></div>
        </div>
        <div class="dpad controls">
          <div class="label">Right Paddle (◀︎/▶︎)</div>
          <div></div>
          <button class="btn" id="left2">◀︎</button>
          <div></div>
          <div></div>
          <button class="btn" id="right2">▶︎</button>
          <div></div>
        </div>
      </div>
    </div>
  </div>

  <script>
  (() => {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Game state
    const state = { over:false, score:0, streak:0, lives:3, speed:3, t:0 };

    // Two paddles
    const p1 = { x: canvas.width*0.25, y: canvas.height-28, w: 150, h: 14, vx:0, speed:8, side:'L' };
    const p2 = { x: canvas.width*0.75, y: canvas.height-28, w: 150, h: 14, vx:0, speed:8, side:'R' };

    // Stars (at most 1 at a time)
    let stars = [];
    function newStar(){
      const side = Math.random() < 0.5 ? 'L' : 'R';
      const halfW = canvas.width/2;
      const min = 40, maxL = halfW-40, minR = halfW+40, max = canvas.width-40;
      const x = side==='L' ? (min + Math.random()*(maxL-min)) : (minR + Math.random()*(max-minR));
      const s = { x, y:-20, r:12, vy: state.speed + Math.random()*2 + state.score*0.01, hue: 40 + Math.random()*40, side };
      stars.push(s);
    }

    // Input
    const keys = new Set();
    window.addEventListener('keydown', e => {
      const k = e.key;
      if (['ArrowLeft','ArrowRight','a','d','A','D','j','l','J','L'].includes(k)) { e.preventDefault(); keys.add(k.toLowerCase()); }
      if (k === ' ' && state.over) restart();
    });
    window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));

    // Buttons
    const byId = id => document.getElementById(id);
    byId('restart').onclick = () => restart();
    byId('slower').onclick = () => state.speed = Math.max(1, state.speed - 1);
    byId('faster').onclick = () => state.speed = Math.min(12, state.speed + 1);

    // mobile pads
    function bindHold(btnId, onDown, onUp){
      const el = byId(btnId);
      el.addEventListener('pointerdown', () => { onDown(); });
      el.addEventListener('pointerup', () => { onUp(); });
      el.addEventListener('pointercancel', () => { onUp(); });
      el.addEventListener('pointerleave', () => { onUp(); });
    }
    bindHold('left1', ()=> p1.vx = -p1.speed, ()=> p1.vx = 0);
    bindHold('right1', ()=> p1.vx =  p1.speed, ()=> p1.vx = 0);
    bindHold('left2', ()=> p2.vx = -p2.speed, ()=> p2.vx = 0);
    bindHold('right2',()=> p2.vx =  p2.speed, ()=> p2.vx = 0);

    function restart(){
      state.over=false; state.score=0; state.lives=3; state.streak=0; state.t=0; stars=[];
      p1.x = canvas.width*0.25; p1.vx=0;
      p2.x = canvas.width*0.75; p2.vx=0;
      newStar();
    }

    function update(){
      // keyboard control mapping
      const leftHeld1 = keys.has('a');
      const rightHeld1 = keys.has('d');
      const leftHeld2 = keys.has('arrowleft');
      const rightHeld2 = keys.has('arrowright');

      p1.vx = (leftHeld1 && !rightHeld1) ? -p1.speed : (rightHeld1 && !leftHeld1) ? p1.speed : 0;
      p2.vx = (leftHeld2 && !rightHeld2) ? -p2.speed : (rightHeld2 && !leftHeld2) ? p2.speed : 0;

      // move paddles, clamp to halves
      const half = canvas.width/2;
      p1.x = Math.max(p1.w/2, Math.min(half - 6 - p1.w/2, p1.x + p1.vx));
      p2.x = Math.max(half + 6 + p2.w/2, Math.min(canvas.width - p2.w/2, p2.x + p2.vx));

      // spawn logic: only when no star exists
      if (!state.over && stars.length === 0 && Math.random() < 0.03 + Math.min(0.02, state.score*0.0005)) newStar();

      // update existing star
      for (let i=stars.length-1; i>=0; i--) {
        const s = stars[i]; s.y += s.vy;
        const paddle = s.side==='L' ? p1 : p2;
        // collide with designated paddle only
        if (s.y + s.r >= paddle.y && s.y - s.r <= paddle.y + paddle.h) {
          if (Math.abs(s.x - paddle.x) < paddle.w/2 + s.r) {
            // caught!
            stars.splice(i,1);
            const bonus = 12 + Math.min(50, state.streak*3);
            state.score += bonus; state.streak++;
            for (let j=0;j<8;j++) particles.push(makeParticle(s.x, paddle.y, s.hue));
            continue;
          }
        }
        // missed beyond floor
        if (s.y - s.r > canvas.height) {
          stars.splice(i,1); state.lives--; state.streak=0;
          for (let j=0;j<12;j++) particles.push(makeParticle(s.x, canvas.height-8, 0, true));
          if (state.lives <= 0) state.over = true;
        }
      }
      state.t++;
    }

    // particles for juice ✨
    const particles = [];
    function makeParticle(x,y,hue,miss){ return { x, y, vx:(Math.random()*2-1)*2, vy: -Math.random()*2-0.5, life: 30+Math.random()*20, hue: miss?0:hue }; }
    function updateParticles(){ for (let i=particles.length-1; i>=0; i--){ const p = particles[i]; p.x+=p.vx; p.y+=p.vy; p.vy += 0.07; p.life-=1; if (p.life<=0) particles.splice(i,1);} }

    function draw(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      // subtle stars
      ctx.save();
      for(let i=0;i<80;i++){
        const x = (i*97 + state.t*0.3) % canvas.width;
        const y = (i*53 + state.t*0.2) % canvas.height;
        ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fillRect(x, y, 2, 2);
      }
      ctx.restore();

      // middle divider
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      for (let y=0; y<canvas.height; y+=12){ ctx.fillRect(canvas.width/2-1, y, 2, 6); }

      // paddles
      ctx.fillStyle = '#9ad0ff'; roundRect(ctx, p1.x-p1.w/2, p1.y, p1.w, p1.h, 6);
      ctx.fillStyle = '#ffc36e'; roundRect(ctx, p2.x-p2.w/2, p2.y, p2.w, p2.h, 6);

      // stars
      stars.forEach(s => drawStar(s.x, s.y, s.r, s.hue));

      // particles
      particles.forEach(p => { ctx.fillStyle = p.hue?`hsl(${p.hue} 90% 60% / .8)`:'rgba(255,90,90,.8)'; ctx.fillRect(p.x, p.y, 3,3); });

      // HUD
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.font = '700 22px system-ui, sans-serif';
      ctx.fillText(`Score: ${state.score}`, 16, 30);
      ctx.fillText(`Lives: ${'❤'.repeat(state.lives)}${'♡'.repeat(Math.max(0,3-state.lives))}`, 16, 58);
      if (state.streak>2) ctx.fillText(`Streak x${state.streak}`, 16, 86);

      if (state.over) {
        ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.font = '800 44px system-ui, sans-serif';
        ctx.fillText('Game Over', canvas.width/2, canvas.height/2 - 26);
        ctx.font = '600 22px system-ui, sans-serif';
        ctx.fillText(`Final score: ${state.score}`, canvas.width/2, canvas.height/2 + 6);
        ctx.fillText(`Press Space or tap Restart`, canvas.width/2, canvas.height/2 + 34);
        ctx.textAlign = 'start';
      }
    }

    function drawStar(x,y,r,hue){
      ctx.save(); ctx.translate(x,y); ctx.rotate((state.t/25) % (Math.PI*2));
      ctx.fillStyle = `hsl(${hue} 90% 60%)`; ctx.beginPath();
      for (let i=0;i<5;i++){
        ctx.lineTo(Math.cos((18+i*72)/180*Math.PI)*r, Math.sin((18+i*72)/180*Math.PI)*r);
        ctx.lineTo(Math.cos((54+i*72)/180*Math.PI)*r*0.5, Math.sin((54+i*72)/180*Math.PI)*r*0.5);
      }
      ctx.closePath(); ctx.shadowColor = `hsl(${hue} 90% 60% / .7)`; ctx.shadowBlur = 15; ctx.fill(); ctx.restore();
    }

    function roundRect(ctx,x,y,w,h,r){
      ctx.beginPath(); ctx.moveTo(x+r, y);
      ctx.arcTo(x+w, y, x+w, y+h, r);
      ctx.arcTo(x+w, y+h, x, y+h, r);
      ctx.arcTo(x, y+h, x, y, r);
      ctx.arcTo(x, y, x+w, y, r);
      ctx.closePath(); ctx.fill();
    }

    function loop(){ update(); updateParticles(); draw(); requestAnimationFrame(loop); }

    // start
    restart();
    loop();
  })();
  </script>
</body>
</html>
